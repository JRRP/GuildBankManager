name: Package and release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Package and publish addon
        uses: BigWigsMods/packager@v2
        env:
          GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}

